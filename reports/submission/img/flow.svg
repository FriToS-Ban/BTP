  <g text-anchor="middle">
    <text x="320" y="30" font-weight="bold">Inputs</text>
    <text x="320" y="51">composition, heat treatment with its temperatures and times, bar diameter, quench</text>
    <text x="105" y="116" font-weight="bold">Steel category</text>
    <text x="105" y="137">and domain check</text>
    <text x="431" y="116" font-weight="bold">Thermodynamics</text>
    <text x="431" y="137">critical temperatures, martensite and bainite start</text>
    <text x="431" y="196" font-weight="bold">Heat flow</text>
    <text x="431" y="217">furnace, still air, liquid quench or Jominy bar</text>
    <text x="431" y="276" font-weight="bold">Transformation kinetics with additivity</text>
    <text x="431" y="297">ferrite, pearlite, bainite and martensite</text>
    <text x="431" y="356" font-weight="bold">Microstructure</text>
    <text x="431" y="377">phase fractions, pearlite spacing, ferrite grain size</text>
    <text x="431" y="436" font-weight="bold">Tempering and stress relief</text>
    <text x="431" y="457">Hollomon–Jaffe parameter and its additivity</text>
    <text x="431" y="516" font-weight="bold">Physics strength and hardness</text>
    <text x="431" y="537">Gladman, Maynier and precipitation strengthening</text>
    <text x="320" y="596" font-weight="bold">Physics-anchored Gaussian-process ensemble, 90% intervals</text>
    <text x="320" y="617">strength, elongation, hardness, transition temperature and warning flags</text>
